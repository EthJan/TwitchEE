name: Refresh Twitch recommendations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: twitch-recommendations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh public live-stream snapshot
        shell: bash
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET must be configured as GitHub Actions secrets." >&2
            exit 1
          fi

          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/data-gather"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install recommendation worker dependencies
        run: python -m pip install "psycopg[binary]==3.2.3"

      - name: Generate personalized recommendations
        run: python notebooks/run_user_recommendations.py
